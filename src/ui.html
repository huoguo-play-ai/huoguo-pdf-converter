<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF 转 Word</title>
<style>/* UI CSS */</style>
</head>
<body data-state="idle">
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<symbol id="doc" viewBox="0 0 24 24"><path d="M6 2h8l5 5v14H6z M14 2v6h5 M9 12h7 M9 16h5"/></symbol>
<symbol id="batch" viewBox="0 0 24 24"><path d="M5 16H3V3h12v2 M8 7h9l4 4v10H8z M17 7v5h4"/></symbol>
<symbol id="lines" viewBox="0 0 24 24"><path d="M3 6h18 M3 12h14 M3 18h18"/></symbol>
<symbol id="pen" viewBox="0 0 24 24"><path d="m4 16 12-12a2 2 0 0 1 4 4L8 20l-5 1z M14 6l4 4"/></symbol>
<symbol id="upload" viewBox="0 0 24 24"><path d="M12 15V3m-5 5 5-5 5 5M3 15v5h18v-5"/></symbol>
<symbol id="down" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M3 16v4h18v-4"/></symbol>
<symbol id="lock" viewBox="0 0 24 24"><path d="M5 10h14v11H5z M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
<symbol id="star" viewBox="0 0 24 24"><path d="m12 1 2.7 8.3L23 12l-8.3 2.7L12 23l-2.7-8.3L1 12l8.3-2.7z"/></symbol>
</svg>
<main>
<header><div class="brand"><span><svg><use href="#doc"/></svg></span>PDF 转 Word</div><span id="badge" role="status"></span></header>
<input id="file" type="file" accept=".pdf,application/pdf" multiple hidden>
<section id="idle">
<h1>PDF 拖进来，<em>Word 带走</em></h1><p class="subtitle">排版几乎不变，打开就能直接改</p>
<div id="drop" class="drop"><div class="upload"><svg><use href="#upload"/></svg></div><h2>把 PDF 拖到这里</h2><p>支持一次拖入多个文件</p><button class="primary pick">选择文件</button><div class="pet-slot"></div></div>
<div class="features"><span><svg aria-hidden="true"><use href="#batch"/></svg>批量转换</span><span><svg aria-hidden="true"><use href="#lines"/></svg>版式还原</span><span><svg aria-hidden="true"><use href="#pen"/></svg>打开就能改</span></div>
</section>
<section id="queue" hidden>
<div class="panel queue-panel"><div class="queue-title"><h2 id="count"></h2><small id="meta"></small></div><ul id="list"></ul>
<div class="tools"><button class="primary" id="go"></button><label>字体 <select id="font"><option value="PingFang SC">苹方（Mac）</option><option value="Microsoft YaHei">微软雅黑（Windows）</option></select></label><button id="clear">清空</button></div></div>
<aside><button class="drop pick" id="append"><svg><use href="#upload"/></svg><strong>继续拖入</strong><small>或点这里选择更多文件</small></button><div class="pet-slot"></div></aside>
</section>
<section id="running" hidden>
<div class="spread"><figure><div id="sourceThumb" class="sheet"></div><figcaption>读取原稿</figcaption></figure><div class="direction">⟶<small>正在重排</small></div><figure><div id="blocks" class="sheet"></div><figcaption>段落、表格、分隔线逐个归位</figcaption></figure></div>
<div class="progress-row"><div><strong id="counter"></strong><progress id="progress"></progress></div><div class="pet-slot"></div></div>
</section>
<section id="report" hidden>
<h1 class="mobile-title">上面是 PDF<br><em>下面是 Word</em></h1>
<div class="panel viewer"><div class="captions"><b>原 PDF</b><b>转换后的 Word</b></div>
<div class="viewport"><div class="compare-frame"><div id="compare">
<div id="pdfLayer" class="layer"></div><div id="wordLayer" class="layer"></div>

<div id="divider"><button id="handle" aria-label="调整对比分割位置">‹ ›</button></div></div><span class="pdf-label">只能看，不能改</span><span class="word-label">可以直接改字</span></div><p id="message" role="status"></p></div>
<div class="viewer-controls"><label>拖动对比 <input type="range" id="split" min="0" max="100" value="50"></label><span id="pager"><button id="prev" aria-label="上一页">‹</button><small id="pageNo"></small><button id="next" aria-label="下一页">›</button></span></div>
</div><aside><ul id="results" class="panel"></ul><div class="actions"><button class="primary" id="zip"><svg><use href="#down"/></svg> 全部下载（zip）</button><button id="again">再转一批</button><div class="pet-slot"></div></div></aside>
</section>
<footer>扫描件暂不支持文字识别</footer>
</main>
<div id="pet" aria-hidden="true"><img src="data:image/webp;base64,MASCOT_DATA" alt=""></div>
<div id="toast" role="status"></div>
<!-- BUNDLE -->
</body></html>
